schemaVersion: "2.0.0"

# Product-starter archetype: Terraform multi-cloud reference (filtered from .tmp/terraform-reference-lab).
# New consumers should start at experiment and promote deliberately.

labId: "iac-product-starter"
name: "Terraform multi-cloud product starter"
maturityStage: "experiment"

clouds:
  aws:
    active: true
    stateBackend: "s3"
    bootstrapRequired: true
  azure:
    active: true
    stateBackend: "azurerm"
    bootstrapRequired: true
  gcp:
    active: true
    stateBackend: "gcs"
    bootstrapRequired: true

modules:
  intent: true
  reality: true
  delta: true
  behavior: true
  evidence: true

governance:
  mode: "hybrid"
  roles:
    - owner
    - senior_engineer
    - engineer
    - agent_operator
  editorAttributionPolicy: "human_only"
  approvalMatrix:
    architecture: [owner, senior_engineer]
    public_interface: [owner, senior_engineer]
    security_critical: [owner, senior_engineer]
    internal_refactor: [owner, senior_engineer, engineer]
  overrides: []

requiredChecks:
  - docs_present
  - signoff_policy_present
  - readiness_checks_present
