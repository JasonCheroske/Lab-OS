domain: secrets
description: >
  Secret storage (Secrets Manager / Key Vault / Secret Manager). Rotation supported.
required_variables:
  - secret_name
  - team
  - environment
  - owner
  - tags
outputs:
  - key: secret_arn
    hint: "Cloud-native unique identifier: ARN for AWS, ARM resource ID for Azure, resource name for GCP"
  - key: secret_name
    hint: "Secret name as provisioned"
