schemaVersion: "1.0.0"
labId: "example-lab"
name: "Example Lab"
maturityStage: "experiment"
modules:
  intent: true
  reality: true
  delta: true
  behavior: true
  evidence: true
governance:
  mode: "hybrid"
  roles:
    - owner
    - senior_engineer
    - engineer
    - agent_operator
  editorAttributionPolicy: "human_only"
  approvalMatrix:
    architecture: [owner, senior_engineer]
    public_interface: [owner, senior_engineer]
    security_critical: [owner, senior_engineer]
    internal_refactor: [owner, senior_engineer, engineer]
  overrides:
    - changeType: "public_interface"
      enabled: true
      reason: "Temporarily allow owner-only approvals for rapid API prototyping."
      approvedBy: "owner@example.org"
      approvedAt: "2026-03-26T00:00:00Z"
      reviewAfter: "2026-04-26T00:00:00Z"
requiredChecks:
  - docs_present
  - signoff_policy_present
  - readiness_checks_present
